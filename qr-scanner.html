
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Go-jak QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg:#101827;
      --panel:#1b2738;
      --muted:#aab7c8;
      --accent:#39a0ed;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:#f5f7fb;
      font-family:Arial,Helvetica,sans-serif;
    }

    .wrap {
      width:min(100%,760px);
      margin:auto;
      padding:20px 16px 32px;
    }

    header {
      text-align:center;
      padding:10px 0 18px;
    }

    h1 {
      margin:0 0 7px;
      font-size:25px;
    }

    .sub {
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .panel {
      background:var(--panel);
      border:1px solid #344256;
      border-radius:16px;
      padding:16px;
      margin:12px 0;
    }

    #reader {
      width:100%;
      overflow:hidden;
      border-radius:12px;
      background:#080d15;
    }

    #reader video {
      border-radius:12px;
      object-fit:cover;
    }

    .buttons {
      display:flex;
      gap:10px;
      margin-top:14px;
    }

    button {
      flex:1;
      border:0;
      border-radius:11px;
      padding:13px 10px;
      color:white;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      background:var(--accent);
    }

    button.secondary { background:#46566d; }

    button:disabled {
      opacity:.45;
      cursor:not-allowed;
    }

    #status {
      margin-top:12px;
      min-height:22px;
      font-size:14px;
      color:#d6e2f0;
      text-align:center;
    }

    #result {
      overflow-wrap:anywhere;
      color:#8ed0ff;
      font-size:13px;
      margin-top:8px;
      text-align:center;
    }

    .foot {
      text-align:center;
      color:#8292a8;
      font-size:11px;
      margin-top:18px;
    }

    @media (max-width:480px) {
      .wrap { padding:14px 12px 24px; }
      h1 { font-size:22px; }
      .panel { padding:12px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <h1>Go-jak QR Scanner</h1>
      <div class="sub">
        Pindai QR perangkat untuk membuka informasi komputer atau printer.
      </div>
    </header>

    <section class="panel">
      <div id="reader"></div>

      <div class="buttons">
        <button id="startBtn" type="button">Mulai Scan</button>
        <button id="stopBtn" class="secondary" type="button" disabled>
          Hentikan
        </button>
      </div>

      <div id="status" role="status">
        Menyiapkan scanner...
      </div>

      <div id="result"></div>
    </section>

    <div class="foot">Go-jak IT Inventory</div>
  </main>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    let scanner = null;
    let running = false;
    let handlingScan = false;

    // Parameter yang dikirim otomatis dari halaman Maintenance.
    const params = new URLSearchParams(window.location.search);

    const webAppUrlText = params.get('webAppUrl') || '';
    const returnUrlText = params.get('returnUrl') || '';

    let webAppUrl = null;
    let maintenanceReturnUrl = null;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    // Validasi URL deployment Web App.
    function validateWebAppUrl(value) {
      if (!value) return null;

      try {
        const parsed = new URL(value);

        if (
          parsed.protocol !== 'https:' ||
          parsed.hostname !== 'script.google.com' ||
          !/^\/macros\/s\/[^/]+\/exec$/.test(parsed.pathname)
        ) {
          return null;
        }

        return parsed;
      } catch (_) {
        return null;
      }
    }

    // URL QR Info dikirim dari Maintenance.
    webAppUrl = validateWebAppUrl(webAppUrlText);

    // Fallback untuk scanner yang dibuka langsung:
    // gunakan URL yang pernah tersimpan sebelumnya.
    if (!webAppUrl) {
      webAppUrl = validateWebAppUrl(
        localStorage.getItem('gojakQrWebAppUrl') || ''
      );
    }

    // Validasi alamat kembali ke Maintenance.
    if (returnUrlText) {
      try {
        const parsed = new URL(returnUrlText);

        if (
          parsed.protocol === 'https:' &&
          parsed.hostname === 'script.google.com' &&
          /^\/macros\/s\/[^/]+\/exec$/.test(parsed.pathname)
        ) {
          maintenanceReturnUrl = parsed;
        }
      } catch (_) {
        maintenanceReturnUrl = null;
      }
    }

    // Simpan URL deployment yang diterima secara otomatis.
    if (webAppUrl) {
      localStorage.setItem(
        'gojakQrWebAppUrl',
        webAppUrl.toString()
      );
    }

    function buildInfoUrl(rawValue) {
      if (!webAppUrl) {
        throw new Error(
          'URL aplikasi tidak tersedia. Buka scanner melalui halaman Maintenance.'
        );
      }

      const destination = new URL(webAppUrl.toString());

      destination.searchParams.set('page', 'qr');
      destination.searchParams.set('id', rawValue.trim());

      return destination.toString();
    }

    // Status awal.
    if (
      maintenanceReturnUrl &&
      window.opener &&
      !window.opener.closed
    ) {
      setStatus(
        'Mode Maintenance aktif. Tekan Mulai Scan untuk membaca QR perangkat.'
      );
    } else if (webAppUrl) {
      setStatus(
        'Siap. Tekan Mulai Scan untuk membaca QR perangkat.'
      );
    } else {
      setStatus(
        'URL aplikasi belum tersedia. Silakan buka scanner dari halaman Maintenance.'
      );
    }

    async function startScan() {
      if (running) return;

      if (!window.Html5Qrcode) {
        setStatus(
          'Library scanner gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.'
        );
        return;
      }

      if (!webAppUrl) {
        setStatus(
          'URL aplikasi tidak tersedia. Buka scanner melalui halaman Maintenance.'
        );
        return;
      }

      try {
        scanner = new Html5Qrcode('reader');

        setStatus('Meminta izin kamera...');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 12,
            qrbox: (w, h) => {
              const side = Math.floor(Math.min(w, h) * 0.78);
              return { width: side, height: side };
            },
            aspectRatio: 1.0
          },
          onScanSuccess,
          () => {}
        );

        running = true;
        handlingScan = false;

        startBtn.disabled = true;
        stopBtn.disabled = false;

        setStatus(
          'Kamera aktif. Arahkan QR perangkat ke dalam kotak.'
        );

      } catch (err) {
        setStatus(
          'Kamera tidak dapat dibuka: ' +
          (err && err.message ? err.message : err)
        );

        scanner = null;
      }
    }

    async function stopScan() {
      if (!scanner || !running) return;

      try {
        await scanner.stop();
        await scanner.clear();
      } catch (_) {}

      scanner = null;
      running = false;

      startBtn.disabled = false;
      stopBtn.disabled = true;

      setStatus('Scanner dihentikan.');
    }

    async function onScanSuccess(decodedText) {
      if (handlingScan) return;

      handlingScan = true;

      const qrText = String(decodedText || '').trim();

      if (!qrText) {
        handlingScan = false;
        return;
      }

      try {
        resultEl.textContent = 'QR terbaca: ' + qrText;

        await stopScan();

        // MODE 1: Scanner dibuka dari halaman Maintenance.
        // Kirim kode QR kembali ke tab Maintenance.
        if (
          maintenanceReturnUrl &&
          window.opener &&
          !window.opener.closed
        ) {
          setStatus(
            'QR berhasil dibaca. Mengirim kode ke Maintenance...'
          );

          window.opener.postMessage(
            {
              type: 'GOJAK_QR_RESULT',
              code: qrText
            },
            maintenanceReturnUrl.origin
          );

          setStatus(
            'Kode QR berhasil dikirim. Menutup scanner...'
          );

          window.close();

          return;
        }

        // MODE 2: Scanner dibuka langsung.
        // Buka halaman QR Info komputer atau printer.
        const destination = buildInfoUrl(qrText);

        setStatus(
          'Berhasil membaca QR. Membuka informasi perangkat...'
        );

        window.location.href = destination;

      } catch (err) {
        setStatus(
          err.message || 'Tidak dapat memproses hasil scan.'
        );

        handlingScan = false;
      }
    }

    startBtn.addEventListener('click', startScan);
    stopBtn.addEventListener('click', stopScan);

    window.addEventListener('beforeunload', () => {
      if (scanner && running) {
        scanner.stop().catch(() => {});
      }
    });
  </script>
</body>
</html>
